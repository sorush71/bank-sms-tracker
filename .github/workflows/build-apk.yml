name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          VERSION_NAME=$(jq -r .version_name version.json)
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/BankTracker-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/BankTracker-v${VERSION_NAME}.apk
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankTracker-apk
          path: release-artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "BankTracker v${{ env.VERSION_NAME }}"
          body_path: version.json
          files: |
            release-artifacts/BankTracker-v${{ env.VERSION_NAME }}.apk
            release-artifacts/BankTracker-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
